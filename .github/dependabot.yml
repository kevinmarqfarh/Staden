version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:07"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 10
    groups:
      application-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 10
    groups:
      security-actions:
        patterns:
          - "*"
