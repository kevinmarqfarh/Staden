version: 2

updates:
  # Application dependency ecosystems are intentionally added only after their
  # first manifest exists; otherwise Dependabot reports a misleading setup error.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 10
    groups:
      security-actions:
        patterns:
          - "*"
