name: Security DAST

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-dast-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: DAST / applicability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.detect.outputs.ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require an explicit local scan harness
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          reason="not executed — package.json, package-lock.json, and the security:dast:start script are required"
          if [[ -f package.json && -f package-lock.json ]] && jq -e '.scripts["security:dast:start"] | type == "string" and length > 0' package.json >/dev/null; then
            ready=true
            reason="applicable — the repository provides a locked localhost scan harness"
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          {
            echo "## DAST and penetration-scan applicability"
            echo
            echo "$reason."
            echo
            echo "This workflow never accepts a target URL. When applicable, both scanners are hard-coded to \`http://127.0.0.1:4173\`; arbitrary external targets cannot be scanned."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$ready" != "true" ]]; then
            echo "::error::DAST was not executed because the required local scan harness is missing."
            exit 1
          fi

  local-security-scan:
    name: DAST + safe penetration baseline / localhost only
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Install locked dependencies
        run: npm ci

      - name: Start the repository-owned local scan harness
        shell: bash
        env:
          HOST: 127.0.0.1
          PORT: "4173"
          STADEN_SECURITY_SCAN: "true"
        run: |
          set -euo pipefail
          npm run security:dast:start -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/staden-dast-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/staden-dast-server.pid"
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "The local DAST harness did not become ready." >&2
          sed -n '1,200p' "$RUNNER_TEMP/staden-dast-server.log" >&2
          exit 1

      - name: OWASP ZAP passive DAST baseline
        id: zap
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
          target: http://127.0.0.1:4173
          allow_issue_writing: false
          fail_action: true
          artifact_name: staden-zap-baseline

      - name: Nuclei non-intrusive penetration baseline
        id: nuclei
        if: always() && steps.zap.outcome != 'cancelled'
        continue-on-error: true
        uses: projectdiscovery/nuclei-action@a4ae23f2522c29f17a696be94fea5f394ac6843f # v3.0.0
        with:
          version: v3.8.0
          cache: false
          args: >-
            -u http://127.0.0.1:4173
            -severity medium,high,critical
            -etags dos,fuzz,intrusive
            -ni
            -rl 25
            -timeout 10
            -retries 1
            -exit-code

      - name: Enforce both dynamic scan results
        if: always()
        shell: bash
        env:
          ZAP_OUTCOME: ${{ steps.zap.outcome }}
          NUCLEI_OUTCOME: ${{ steps.nuclei.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## Dynamic security results"
            echo
            echo "| Scanner | Outcome | Target restriction |"
            echo "| --- | --- | --- |"
            echo "| OWASP ZAP baseline | $ZAP_OUTCOME | localhost only |"
            echo "| Nuclei non-intrusive baseline | $NUCLEI_OUTCOME | localhost only; DoS, fuzz, intrusive and out-of-band checks excluded |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$ZAP_OUTCOME" != "success" || "$NUCLEI_OUTCOME" != "success" ]]; then
            echo "One or both dynamic scanners did not complete successfully." >&2
            exit 1
          fi

  required-gate:
    name: DAST / required gate
    if: always()
    needs: [preflight, local-security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREFLIGHT_RESULT: ${{ needs.preflight.result }}
      READY: ${{ needs.preflight.outputs.ready }}
      SCAN_RESULT: ${{ needs.local-security-scan.result }}
    steps:
      - name: Require an executed dynamic scan
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PREFLIGHT_RESULT" != "success" || "$READY" != "true" ]]; then
            echo "DAST was NOT EXECUTED because its required local harness is missing or invalid." >&2
            echo "**Overall status: FAILED / NOT EXECUTED — the required local DAST harness is missing or invalid.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$SCAN_RESULT" != "success" ]]; then
            echo "DAST or penetration baseline failed or was cancelled." >&2
            exit 1
          fi
          echo "**Overall status: PASSED — both localhost-only dynamic scans completed.**" >> "$GITHUB_STEP_SUMMARY"
